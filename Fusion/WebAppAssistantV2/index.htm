    <title>CASA VIVA + Assistant</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary-blue: #1a73e8;
        --primary-blue-dark: #1557b0;
        --success-green: #34a853;
        --success-green-dark: #2d8e47;
        --warning-yellow: #fbbc04;
        --error-red: #ea4335;
        --text-dark: #202124;
        --text-medium: #5f6368;
        --text-light: #80868b;
        --bg-light: #f8f9fa;
        --bg-white: #ffffff;
        --border-light: #dadce0;
        --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        --shadow-md: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        --shadow-lg: 0 2px 6px 2px rgba(60,64,67,0.3), 0 8px 12px 6px rgba(60,64,67,0.15);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: var(--text-dark);
        font-family: 'Poppins', 'Roboto', 'Segoe UI', sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      h1 {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        margin: 0;
        padding: 20px 40px;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-dark);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      h1::before {
        content: "🗺️";
        font-size: 28px;
      }

      .mic {
        width: 120px;
        height: 120px;
        transition: transform 0.2s ease, filter 0.2s ease;
        cursor: pointer;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      }

      .mic:hover {
        transform: scale(1.05);
        filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
      }

      .mic:active {
        transform: scale(0.98);
      }

      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        width: 100%;
        padding: 24px 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-md);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .responseText {
        border: 2px solid var(--primary-blue);
        border-left: 6px solid var(--primary-blue);
        margin: 16px 0;
        padding: 16px 20px;
        color: var(--text-dark);
        background: var(--bg-white);
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
        font-size: 16px;
        line-height: 1.5;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .bottomNav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 24px;
        background: linear-gradient(to top, rgba(0,0,0,0.1) 0%, transparent 100%);
      }

      .recognized {
        font-size: 20px;
        font-weight: 500;
        color: var(--text-dark);
        min-width: 300px;
        text-align: left;
        line-height: 1.4;
      }

      .recognized b {
        font-weight: 600;
      }

      #response {
        max-width: 800px;
        margin: 0 auto;
      }

      /* Status indicator styles */
      .status-waiting {
        color: var(--text-medium);
        font-style: italic;
      }

      .status-listening {
        color: var(--success-green);
        animation: pulse 1.5s ease-in-out infinite;
      }

      .status-error {
        color: var(--error-red);
      }

      .status-success {
        color: var(--success-green-dark);
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      /* Microphone circle animation states */
      .st0 {
        transition: fill 0.3s ease;
      }

      /* Info badge */
      .info-badge {
        position: fixed;
        top: 80px;
        right: 24px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 12px 20px;
        border-radius: 24px;
        box-shadow: var(--shadow-sm);
        font-size: 14px;
        color: var(--text-medium);
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border-light);
      }

      .info-badge::before {
        content: "ℹ️";
        font-size: 16px;
      }

      /* Responsive design */
      @media (max-width: 768px) {
        h1 {
          font-size: 20px;
          padding: 16px 24px;
        }

        .container {
          flex-direction: column;
          padding: 20px 16px;
        }

        .recognized {
          min-width: auto;
          width: 100%;
          text-align: center;
          font-size: 18px;
        }

        .mic {
          width: 100px;
          height: 100px;
        }

        .info-badge {
          top: auto;
          bottom: 200px;
          right: 16px;
          left: 16px;
          justify-content: center;
        }
      }
    </style>
  </head>

<script type="module">

var isOnKWS=false;
const sensor = new MicrophoneSensor();
  let classifyCache = {};
  let allData = [];
  let allClassifications = [];
  let casa_vivaStarted = null;

async function startkws(){
  classifyCache = {};
  allData = [];
  allClassifications = [];
  casa_vivaStarted = null;

  isOnKWS=false;
  //await sensor.takeSample(200, 16000, () => {});
  sensor.takeSample(1000, 16000, () => {}).then(onSampleComplete);
}

setTimeout(function(){
  classifyCache = {};
  allData = [];
  allClassifications = [];
  casa_vivaStarted = null;
}, 60*60*1000);

const onSampleComplete = (obj) => {
    if(!isOnKWS)
    sensor.takeSample(500, 16000, () => {}).then(onSampleComplete);

    allData = allData.concat(obj.values);
    //console.log(Date.now(), 'allData is', allData.length / 16000, 'seconds');

    const windowSize = 3 * 16000;
    const windowStep = 0.5 * 16000;
    const classifyWindowLength = 0.5 * 16000;
    const classifyWindowOverlap = 0.25 * 16000;

    // if we have at least one window of data...
    if (allData.length >= windowSize) {
      let window = allData.slice(allData.length - windowSize, allData.length);

      let noiseCount = 0;
      let casa_vivaCount = 0;
      let uncertainCount = 0;

      // in here we'll take 1 second slices, with 300 ms. overlap that we then classify (total 14 windows)
      console.time('classifyWindow');
      for (let wx = 0; wx <= windowSize - classifyWindowLength; wx += classifyWindowOverlap) {
        const cacheKey = allData.length - windowSize + wx;

        let classifyResult;
        if (!classifyCache[cacheKey]) {
            let slice = window.slice(wx, wx + classifyWindowLength);

            classifyCache[cacheKey] = classifier.classify(slice, false);
        }

        classifyResult = classifyCache[cacheKey];
        let noise = classifyResult.results.find(r => r.label === 'noise').value;
        let casa_viva = classifyResult.results.find(r => r.label === 'casa_viva').value;

if(casa_viva>.3)
        console.log(casa_viva);
        if (noise >= 0.6) {
            noiseCount++;
        }
        else if (casa_viva >= 0.6) {
            casa_vivaCount++;

            if(!isOnKWS){
              recognition.start();
              circle.animate(20, 0, 'now').attr({ fill: '#00a431' });
              transcriptDiv.textContent = "...";
              isOnKWS=true;
            }

        }
        else {
            uncertainCount++;
        }
      }
    }
    //console.timeEnd('classifyWindow');
  };

};

  import { interpolateGreens } from "https://cdn.skypack.dev/d3-scale-chromatic@3"

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  // Wake word recognition instance (continuous listening for "maps")
  const wakeWordRecognition = new SpeechRecognition();
  wakeWordRecognition.continuous = true;
  wakeWordRecognition.interimResults = true;
  wakeWordRecognition.lang = 'pt-PT';

  // Command recognition instance (activated after wake word)
  const recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'pt-PT';


  var circle = SVG.find('.st0');//.fill('#ccc');
  const startBtn = document.getElementById('start-btn');
  const transcriptDiv = document.getElementById('transcript');
  const energyDiv = document.getElementById('energy');

  var firstSent = "Diga 'maps' para começar a falar.";
  transcriptDiv.textContent = firstSent;
  var isWaitingForWakeWord = true;
  var resetfunc ;

  // Wake word recognition handlers
  wakeWordRecognition.onresult = function(event) {
    for (var i = event.resultIndex; i < event.results.length; ++i) {
      var transcript = event.results[i][0].transcript.trim().toLowerCase();
      console.log("Wake word detection: " + transcript);

      // Check if "maps" or "mapa" is detected
      if (transcript.includes("maps") || transcript.includes("mapa") || transcript.includes("map")) {
        console.log("Wake word detected!");
        isWaitingForWakeWord = false;
        wakeWordRecognition.stop();

        // Visual feedback
        circle.animate(20, 0, 'now').attr({ fill: '#00a431' });
        transcriptDiv.textContent = "Escutando...";

        // Start command recognition
        setTimeout(function() {
          recognition.start();
        }, 300);

        break;
      }
    }
  };

  wakeWordRecognition.onerror = function(event) {
    console.error("Wake word recognition error: " + event.error);
    if (event.error === 'no-speech' || event.error === 'audio-capture') {
      // Restart wake word listening
      setTimeout(function() {
        if (isWaitingForWakeWord) {
          wakeWordRecognition.start();
        }
      }, 1000);
    }
  };

  wakeWordRecognition.onend = function() {
    console.log("Wake word recognition ended");
    // Restart if still waiting for wake word
    if (isWaitingForWakeWord) {
      setTimeout(function() {
        wakeWordRecognition.start();
      }, 500);
    }
  };

  recognition.onerror = function(event) {
    console.error("REC ERROR"+event.error);
    transcriptDiv.innerHTML = firstSent;
    circle.animate(20, 0, 'now').attr({ fill: '#000' });
    //startkws();
    resetfunc = setTimeout(function(){
      transcriptDiv.innerHTML = firstSent;
      isWaitingForWakeWord = true;
      wakeWordRecognition.start();
      circle.animate(20, 0, 'now').attr({ fill: '#444' });
    }, 500);
  };

  recognition.onresult = function(event) {
    speechActive=false;
    var interim_transcript = '';
    var final_transcript = '';

    for (var i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        //if(event.results[i][0].confidence>0.6)
        energyDiv.textContent += event.results[i][0].confidence;
        {
          final_transcript ="";
          console.log("++"+event.results[i][0].transcript+"++");
          final_transcript=event.results[i][0].transcript.trim();
          /*var sentence = event.results[i][0].transcript.trim().toLowerCase();
          if(sentence.startsWith("casa viva") || sentence.startsWith("viva") || sentence.startsWith("aviva") || sentence.startsWith("sa viva") || sentence.startsWith("da viva") ||sentence.startsWith("ora viva"))
          {
            var indSent = sentence.indexOf("viva");
            final_transcript= sentence.slice(indSent+5);
          }*/
        }

        if(final_transcript.length>2){
          final_transcript = final_transcript.charAt(0).toUpperCase()+ final_transcript.slice(1);
          transcriptDiv.innerHTML = "<span style='color:#00b44e'><b>"+final_transcript+"</b></span>";

          sendMMI(final_transcript);
          circle.animate(20, 0, 'now').attr({ fill: '#000' });
          //startkws();

        }else{
          transcriptDiv.innerHTML = "<span style='color:#ff9494'><b>Desculpe nao consegui ententer.</b></span>";
        }

        resetfunc = setTimeout(function(){
          transcriptDiv.innerHTML = firstSent;
          isWaitingForWakeWord = true;
          wakeWordRecognition.start();
          circle.animate(20, 0, 'now').attr({ fill: '#444' });
        }, 1000);

        speechActive = false;
      }else{
        //if(event.results[i][0].confidence>0.6)
        {
          console.log(event.results[i][0].transcript + " -- " + i);
          var sentence = event.results[i][0].transcript.trim().toLowerCase();
          /*if(sentence.startsWith("casa viva") || sentence.startsWith("viva") || sentence.startsWith("aviva") || sentence.startsWith("sa viva") || sentence.startsWith("da viva") ||sentence.startsWith("ora viva") ){
            var indSent = sentence.indexOf("viva");
            final_transcript= sentence.slice(indSent+5);
          }*/

        }
        transcriptDiv.textContent = event.results[i][0].transcript.trim().toLowerCase();
      }
    }
  };

  $(".mic").on('click', function(){
    // Stop wake word listening if active
    if (isWaitingForWakeWord) {
      wakeWordRecognition.stop();
      isWaitingForWakeWord = false;
    }
    recognition.start();
    circle.animate(20, 0, 'now').attr({ fill: '#00a431' });
    console.log("start");
  })

  // Start wake word listening on page load
  setTimeout(function() {
    console.log("Starting wake word recognition for 'maps'");
    circle.animate(20, 0, 'now').attr({ fill: '#444' });
    wakeWordRecognition.start();
  }, 1000);

  var vadActive = false;
  var speechActive = true;

  async function main() {
    const myvad = await vad.MicVAD.new({

      onSpeechEnd: (audio) => {
        // do something with `audio` (Float32Array of audio samples at sample rate 16000)...
        //transcriptDiv.textContent += "-";
        vadActive = false;

        if(!speechActive){

        }

      },
      onFrameProcessed: (probs) => {
        if(vadActive || speechActive){
          const indicatorColor = interpolateGreens(probs.isSpeech / 1.5);
          //circle.fill(indicatorColor);
          circle.animate(20, 0, 'now').attr({ fill: indicatorColor });
        }
        //    energyDiv.textContent = probs.isSpeech + "--" + probs.notSpeech;
        //document.body.style.setProperty("--indicator-color", indicatorColor)
      },
    })
    //myvad.start()




  }
  //main()

  if ('speechSynthesis' in window) {
	  console.log('Your browser <strong>supports</strong> speech synthesis.');
  }

  var ttsSpeaker;
  var voicesLoaded = false;

  window.speechSynthesis.onvoiceschanged = function(e) {
    var voices = speechSynthesis.getVoices();
    console.log("Available voices:", voices.length);

    // Default to first voice as fallback
    ttsSpeaker = voices[0];

    // Try to find Portuguese (Portugal) voice
    for (let i = 0; i < voices.length; i++) {
      console.log("Voice " + i + ":", voices[i].name, voices[i].lang);

      if(voices[i].lang == "pt-PT" || voices[i].lang.startsWith("pt-PT")){
        console.log("Found Portuguese voice:", voices[i]);
        ttsSpeaker = voices[i];

        // Prefer "Duarte" if available
        if(voices[i].name.includes("Duarte")) {
          ttsSpeaker = voices[i];
          break;
        }
      }
    }

    console.log("Selected TTS speaker:", ttsSpeaker);
    voicesLoaded = true;
  };

  function speak(text){
    console.log("speak() called with:", text);

    // Stop wake word recognition while speaking to avoid interference
    if (isWaitingForWakeWord) {
      wakeWordRecognition.stop();
    }

    // Ensure voices are loaded
    if (!voicesLoaded) {
      var voices = speechSynthesis.getVoices();
      if (voices.length > 0) {
        // Try to set Portuguese voice immediately
        for (let i = 0; i < voices.length; i++) {
          if(voices[i].lang == "pt-PT" || voices[i].lang.startsWith("pt-PT")){
            ttsSpeaker = voices[i];
            if(voices[i].name.includes("Duarte")) {
              ttsSpeaker = voices[i];
              break;
            }
          }
        }
        voicesLoaded = true;
      }
    }

    var msg = new SpeechSynthesisUtterance();
    msg.text = text;
    msg.lang = 'pt-PT';  // Force Portuguese language

    // Set the attributes.
    msg.volume = parseFloat(1);
    msg.rate = parseFloat(1.1);
    msg.pitch = parseFloat(1);

    msg.voice = ttsSpeaker;

    console.log("Speaking with voice:", msg.voice, "language:", msg.lang);

    msg.onstart = function() {
      console.log("TTS started speaking");
    };

    var ttsEndHandled = false;

    // Function to handle TTS end
    function handleTTSEnd() {
      if (ttsEndHandled) return; // Prevent double execution
      ttsEndHandled = true;

      console.log("TTS finished - handling end");

      if (pendingQuestionActivation) {
        // Question was asked - auto-activate recognition
        console.log("Auto-starting recognition for question answer");
        pendingQuestionActivation = false;
        setTimeout(function() {
          console.log("Starting recognition now...");
          recognition.start();
          circle.animate(20, 0, 'now').attr({ fill: '#00a431' });
          transcriptDiv.textContent = "Escutando...";
        }, 500); // Increased delay to ensure TTS is fully finished
      } else if (isWaitingForWakeWord) {
        // Normal flow - resume wake word listening
        console.log("Resuming wake word detection");
        setTimeout(function() {
          wakeWordRecognition.start();
        }, 500);
      }
    }

    // Resume wake word listening after TTS finishes OR activate question listening
    msg.onend = function() {
      console.log("TTS onend event fired");
      handleTTSEnd();
    };

    // Fallback: Some browsers don't always fire onend reliably
    // Estimate speech duration and use timeout as backup
    var estimatedDuration = (msg.text.length / 15) * 1000; // ~15 chars per second
    setTimeout(function() {
      if (!window.speechSynthesis.speaking && !ttsEndHandled) {
        console.log("TTS timeout fallback - assuming speech finished");
        handleTTSEnd();
      }
    }, estimatedDuration + 1000);

    msg.onerror = function(event) {
      console.error("TTS error:", event);
      // Resume wake word listening even on error
      if (isWaitingForWakeWord) {
        setTimeout(function() {
          wakeWordRecognition.start();
        }, 500);
      }
    };

    // Cancel any pending speech first
    window.speechSynthesis.cancel();

    // Speak immediately (onend handlers are already registered)
    console.log("Calling speechSynthesis.speak()");
    window.speechSynthesis.speak(msg);
    console.log("Speech synthesis queue - pending:", window.speechSynthesis.pending, "speaking:", window.speechSynthesis.speaking);
    console.log("Pending question activation:", pendingQuestionActivation);
  }

  // Direct WebSocket connection to server.py for TTS (bypasses FusionEngine)
  var ttsWebSocket = null;
  function connectTTSWebSocket() {
    ttsWebSocket = new WebSocket("ws://127.0.0.1:8083");

    ttsWebSocket.onopen = function(event) {
      console.log("TTS WebSocket connected to ws://127.0.0.1:8083");
    };

    var pendingQuestionActivation = false;

    ttsWebSocket.onmessage = function(event) {
      console.log("TTS WebSocket received:", event.data);
      try {
        var data = JSON.parse(event.data);
        if (data.text) {
          console.log("Speaking:", data.text);

          // Check if TTS message ends with "?" (question) - auto-activate listening
          if (data.text.trim().endsWith("?")) {
            console.log("Question detected, will auto-activate after TTS finishes");
            pendingQuestionActivation = true;

            // Stop wake word listener temporarily
            if (isWaitingForWakeWord) {
              wakeWordRecognition.stop();
              isWaitingForWakeWord = false;
            }
          }

          speak(data.text);
        }
      } catch (e) {
        console.error("Failed to parse TTS message:", e);
      }
    };

    ttsWebSocket.onerror = function(error) {
      console.error("TTS WebSocket error:", error);
    };

    ttsWebSocket.onclose = function(event) {
      console.log("TTS WebSocket closed, reconnecting in 1s...");
      setTimeout(connectTTSWebSocket, 1000);
    };
  }

  connectTTSWebSocket();

  var lastSpokenText = "";
  var lastSpokenTime = 0;

  function im1MessageHandler(data) {

    console.log("--------------im1MessageHandler---------------");
    console.log("Received data at:", new Date().toISOString());

    if(data != null && data!="RENEW" && data!="OK") {

      console.log("Full message:", data);

      var content = $(data).find("emma\\:interpretation").first().text().trim();

      if (typeof content == 'string' && content.length > 0) {
        console.log("Content:", content);

        var text = content;

        // Try to parse as JSON first (new format)
        try {
          var jsonData = JSON.parse(content);
          if (jsonData.text) {
            text = jsonData.text;
            console.log("Extracted text from JSON:", text);
          }
        }
        catch (e) {
          // Not JSON, try XML/SSML
          try {
            var xml = $.parseXML(content.replace(/\\"/g, "\"").slice(1,-1));
            // Extract sentence from <p> tag
            text = $(xml).find("p").text();
            console.log("Extracted text from SSML:", text);
          }
          catch (e2) {
            // Not XML either, use content as-is (plain text)
            console.log("Using plain text:", content);
          }
        }

        if (text && text.length > 0) {
          console.log("Final text to speak:", text);

          // Prevent duplicate messages within 2 seconds
          var now = Date.now();
          if (text === lastSpokenText && (now - lastSpokenTime) < 2000) {
            console.log("DUPLICATE MESSAGE DETECTED - Skipping speak()");
            return;
          }

          lastSpokenText = text;
          lastSpokenTime = now;

          speak(text);

          $("#response").html(text);
          $("#response").addClass("container");
          $("#response").addClass("responseText");

          setTimeout(function(){
            $("#response").html("");
            $("#response").removeClass("container");
            $("#response").removeClass("responseText");
          }, 3000);
        }
      }
    }
  }
